<style>
/* Elements start hidden and animate in, so reduced motion must jump to the end state. */
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.fade { opacity: 0; animation: fade .8s ease-out .2s forwards; }
.track { stroke-dasharray: 406; stroke-dashoffset: 406; animation: draw 2.00s ease-in-out .3s forwards; }
.m { opacity: 0; animation: pop .5s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; transform: none !important; }
}
</style>
